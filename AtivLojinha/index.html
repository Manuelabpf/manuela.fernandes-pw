<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lojinha Camargo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🛒 Lojinha Camargo</h1>

    <table>
        <tr>
            <th>Imagem</th>
            <th>Produto</th>
            <th>Preço Unitário</th>
            <th>Qtd</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>
                <img src="Celular Top Motorola.jpg" alt="Celular">
            </td>
            <td>
                Celular Top Motorola<br>
                Código: 1234AE<br>
                Cor: Preto
            </td>
            <td>R$ 1000</td>
            <td>
                <button class="menos">-</button>
                <span class="qtd">3</span>
                <button class="mais">+</button>
            </td>
            <td class="total">R$ 3000</td>
        </tr>

        <tr>
            <td>
                <img src="Televisão Ultra.jpg" alt="TV">
            </td>
            <td>
                Televisão Ultra<br>
                Código: 1FFB44AE<br>
                Cor: Preto
            </td>
            <td>R$ 9000</td>
            <td>
                <button class="menos">-</button>
                <span class="qtd">0</span>
                <button class="mais">+</button>
            </td>
            <td class="total">R$ 0</td>
        </tr>

        <tr>
            <td>
                <img src="Notebook Dell Ultra.jpg" alt="Notebook">
            </td>
            <td>
                Notebook Dell Ultra<br>
                Código: 23TB44AE<br>
                Cor: Prata
            </td>
            <td>R$ 9000</td>
            <td>
                <button class="menos">-</button>
                <span class="qtd">3</span>
                <button class="mais">+</button>
            </td>
            <td class="total">R$ 27000</td>
        </tr>

    </table>

    <div class="subtotal">
        SUBTOTAL: R$ 30000
    </div>

    <script src="script.js"></script>

</body>
</html>
